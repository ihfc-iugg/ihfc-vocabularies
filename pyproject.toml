[project]
name = "ihfc-vocabularies"
version = "2026.1"
description = "SKOS vocabularies for the scientific study of Earth's heat flow."
readme = "README.md"
license = "CC-BY-4.0 AND MIT"
requires-python = ">=3.12"
authors = [{ name = "Sam Jennings", email = "samuel.scott.jennings@gmail.com" }]
dependencies = ["rdflib>=7.1"]

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
# rdflib's JSON-LD parser uses its own deprecated ConjunctiveGraph.
filterwarnings = ["ignore:ConjunctiveGraph is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
