name: Publish

# Attaches every vocabulary, in every format, to a published GitHub Release.
# The release tag must be the version in pyproject.toml with a leading "v".

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: Attach the vocabularies to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match version v$version in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the vocabularies
        run: uv run pytest
      - name: Export the vocabularies
        run: |
          name="ihfc-vocabularies-$VERSION"
          uv run python scripts/build_vocabularies.py --export "dist/$name"
          cp LICENSE-CC-BY-4.0 "dist/$name/LICENSE"
          (cd dist && zip -r "$name.zip" "$name")
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "dist/ihfc-vocabularies-$VERSION.zip" --clobber
