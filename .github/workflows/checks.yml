name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check vocabularies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Lint
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Check the vocabularies and their exports
        run: uv run pytest
